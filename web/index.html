<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batcave</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">
        <header>
            <h1>Batcave</h1>
            <p>Personal cloud · Galaxy Tab S6 Lite</p>
        </header>

        <section class="cards">
            <a href="#" class="card">
                <span>📁</span>
                <h2>Files</h2>
                <p>Documents and storage</p>
            </a>

            <a href="#" class="card">
                <span>📷</span>
                <h2>Photos</h2>
                <p>Your personal gallery</p>
            </a>

            <a href="#" class="card">
                <span>📝</span>
                <h2>Notes</h2>
                <p>Quick thoughts and notes</p>
            </a>

            <a href="#" class="card">
                <span>💡</span>
                <h2>Ideas</h2>
                <p>Things worth building</p>
            </a>

            <a href="#" class="card">
                <span>🔧</span>
                <h2>Projects</h2>
                <p>Active and archived projects</p>
            </a>

            <a href="#" class="card">
                <span>💾</span>
                <h2>Backups</h2>
                <p>System and data backups</p>
            </a>
        </section>
    </main>

</body>
</html>
